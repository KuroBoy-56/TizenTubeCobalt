name: Build Cobalt
description: Builds Cobalt targets
inputs:
  targets:
    description: "JSON list of ninja targets for Cobalt build."
    required: true
  test_root_target:
    description: "The root target from which to deduce what tests to run."
    required: true
  test_targets_json_file:
    description: "The path to the file the test targets are written to."
    required: true
  enable_sccache:
    description: Use sccache for build acceleration.
    default: 'false'
  sccache_gcs_key:
    description: GCS SA key to read/write to bucket
runs:
  using: "composite"
  steps:
      - name: Clean out dir from previous runner
        run: |
          rm -rf cobalt/src/out
        shell: bash
        
      # HACK 1: INYECTAR EL BAÚL DE GITHUB PARA GUARDAR EL CACHÉ LOCALMENTE
      - name: Restaurar y Guardar Caché en GitHub
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.platform }}-
          save-always: true

      # INSTALACIÓN DIRECTA DE LINUX: Ignoramos el script roto de Mac de Google
      - name: Install sccache
        run: |
          echo "Descargando sccache para Linux..."
          wget https://github.com/mozilla/sccache/releases/download/v0.8.1/sccache-v0.8.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf sccache-v0.8.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv sccache-v0.8.1-x86_64-unknown-linux-musl/sccache /usr/local/bin/
          sudo chmod +x /usr/local/bin/sccache
          sccache --version
        shell: bash
          
      - name: GN gen
        env:
          ENABLE_SCCACHE: 'true'
        run: |
          cd cobalt/src
          gn_flags=()
          
          # LA CURA: Apagar la ejecución remota de Google (RBE) desde el primer segundo
          gn_flags+=(--no-rbe)
          
          if [[ $ENABLE_SCCACHE == "true" ]]; then
            gn_flags+=(--use-sccache)
          fi
          cobalt/build/gn.py -p ${{ matrix.platform }} -C ${{ matrix.config }} "${gn_flags[@]}"
          
          # HACK: Forzar apagado de siso y ejecucion remota extra por seguridad
          echo 'use_siso = false' >> out/${{ matrix.platform }}_${{ matrix.config }}/args.gn
          echo 'use_remoteexec = false' >> out/${{ matrix.platform }}_${{ matrix.config }}/args.gn
        shell: bash
        
      - name: Calculate test targets
        if: matrix.config == 'devel'
        id: calculate-test-targets
        env:
          STATIC_TEST_TARGETS_JSON_FILE: cobalt/build/testing/targets/${{ matrix.platform }}/test_targets.json
        run: |
          set -x
          cd cobalt/src
          if [[ ! -f "${STATIC_TEST_TARGETS_JSON_FILE}" ]]; then
            echo "test_targets_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          cp -av "${STATIC_TEST_TARGETS_JSON_FILE}" "${{ inputs.test_targets_json_file }}"
          test_targets_json=$(cat ${{ inputs.test_targets_json_file }} | jq -cr '.test_targets')
          echo "test_targets_json=${test_targets_json}" >> $GITHUB_OUTPUT
          test_targets_count=$(echo ${test_targets_json} | jq -cr 'length')
          echo "test_targets_count=${test_targets_count}" >> $GITHUB_OUTPUT
        shell: bash
        
      - name: Ninja build
        env:
          TARGETS_JSON: ${{ inputs.targets }}
          USE_SCCACHE: 'true'
        run: |
          cd cobalt/src
          
          # Configurar sccache para que use nuestra carpeta local
          export SCCACHE_DIR=~/.cache/sccache
          export SCCACHE_CACHE_SIZE="9G"
          
          echo "Instalando dependencias del sistema en Ubuntu (Java, gperf)..."
          sudo apt-get update -y || true
          sudo apt-get install -y default-jre-headless gperf || true
          
          echo "Buscando keytool..."
          KEYTOOL_CMD="keytool"
          echo "Forjando llave Android..."
          $KEYTOOL_CMD -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          
          mkdir -p ~/.android && cp /tmp/debug.keystore ~/.android/debug.keystore || true
          mkdir -p ../../.android && cp /tmp/debug.keystore ../../.android/debug.keystore || true
          mkdir -p ../../../../.android && cp /tmp/debug.keystore ../../../../.android/debug.keystore || true
          mkdir -p /root/.android && cp /tmp/debug.keystore /root/.android/debug.keystore || true

          TARGETS=$(echo "${TARGETS_JSON}" | jq -cr '. | join(" ")')
          
          # HACK 2: EL TEMPORIZADOR MAESTRO (330 minutos = 5.5 horas)
          echo "Iniciando compilacion con limite de tiempo seguro..."
          set +e 
          
          timeout 330m autoninja -j 1 -C out/${{ matrix.platform }}_${{ matrix.config }} ${TARGETS}
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 124 ]; then
            echo "⏳ CHECKPOINT ALCANZADO: 5.5 horas transcurridas."
            echo "Deteniendo el motor suavemente para obligar a GitHub a guardar el progreso de los archivos..."
            exit 0 
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Error real en la compilación. Código: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          set -e
          
          if [[ $USE_SCCACHE == "true" ]]; then
            sccache --show-stats
          fi
        shell: bash
        
      - name: Archive Android APKs
        if: startsWith(matrix.platform, 'android')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.config }}-APKs
          path: |
            cobalt/src/out/${{ matrix.platform }}_${{ matrix.config }}/apks/*.apk
            cobalt/src/out/${{ matrix.platform }}_${{ matrix.config }}/*_apk/*.apk
            cobalt/src/out/${{ matrix.platform }}_${{ matrix.config }}/gen/build_info.json

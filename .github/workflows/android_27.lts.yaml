name: android_27.lts

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
    branches:
      - 27.lts
      - main
  push:
    branches:
      - 27.lts
      - main
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly workflow.'
        required: true
        type: boolean
        default: false
      attempt:
        description: 'Número de relanzamiento automático (uso interno).'
        required: false
        type: string
        default: '1'

jobs:
  # FRANCOTIRADOR: Únicamente la versión universal para TV Box y Móviles
  android-arm:
    uses: ./.github/workflows/main.yaml
    permissions:
      packages: write
      pull-requests: write
    with:
      platform: android-arm
      nightly: ${{ github.event.inputs.nightly }}
    secrets:
      datadog_api_key: ${{ secrets.DD_API_KEY }}
      android_keystore_b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

  # Publica la APK como Release (enlace fijo: releases/latest/download/YouTubeModTV.apk).
  # Solo con la llave fija, para no publicar APKs que no se puedan instalar encima.
  release:
    needs: [android-arm]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.android-arm.outputs.timed_out != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Comprobar llave fija
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "Sin ANDROID_KEYSTORE_B64: no se publica release."; fi
      - name: Descargar APK
        if: steps.ks.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-arm-gold-APKs
          path: apk
      - name: Publicar release
        if: steps.ks.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          cp "$APK" YouTubeModTV.apk
          gh release create "tv-${{ github.run_number }}" YouTubeModTV.apk --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "YouTube Mod TV #${{ github.run_number }}" \
            --notes "Build ${{ github.sha }}" --latest

  # Si la compilación se detuvo en el checkpoint, relanza el workflow para continuar desde el caché.
  auto-rerun:
    needs: [android-arm]
    if: ${{ github.event_name != 'pull_request' && needs.android-arm.outputs.timed_out == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relanzar compilación con el caché guardado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          # Tope de seguridad para no quedar en bucle si el caché no avanza.
          if [ "$ATTEMPT" -ge 10 ]; then
            echo "Se alcanzó el máximo de 10 relanzamientos automáticos. Deteniendo."
            exit 1
          fi
          NEXT=$((ATTEMPT + 1))
          echo "Relanzando compilación (intento $NEXT) en ${{ github.ref_name }}..."
          gh workflow run android_27.lts.yaml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f nightly=false -f attempt="$NEXT"
